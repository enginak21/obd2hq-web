name: Daily GSC Recovery Monitor

on:
  schedule:
    - cron: '10 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
      GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL || 'sc-domain:obd2hq.com' }}
      REQUIRE_GSC_CREDENTIALS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch observe-only Search Console recovery snapshot
        run: node scripts/fetch_gsc_recovery_snapshot.js

      - name: Quality checks
        run: |
          npm run check:news-routing
          npm run check:sitemap-quality
          npm run check:canonical-freeze

      - name: Commit observe-only recovery snapshot
        run: |
          if git diff --quiet -- reports/seo/recovery-monitor; then
            echo "No GSC recovery snapshot changes."
            exit 0
          fi
          git config user.name "obd2hq-recovery-monitor"
          git config user.email "actions@github.com"
          git add reports/seo/recovery-monitor
          git commit -m "chore: update daily gsc recovery snapshot"
          git push
